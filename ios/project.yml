# XcodeGen spec: `xcodegen generate` (in ios/) writes Azwall.xcodeproj, which is not committed.
# Build the Rust core first: scripts/build-ios.sh, scripts/build-bb-ios.sh all, then scripts/fetch-crs.sh.
name: Azwall
options:
  bundleIdPrefix: dev.azwall
  deploymentTarget:
    iOS: "17.0"
packages:
  AzwallKit:
    path: AzwallKit
  AzwallRust:
    path: AzwallRust
targets:
  Azwall:
    type: application
    platform: iOS
    sources:
      - Azwall
      # Generated: networks.json + .env (azwall-config) and the CRS (scripts/fetch-crs.sh).
      - path: ../assets/azwall-config.json
        buildPhase: resources
      - path: ../assets/crs
        type: folder
        buildPhase: resources
      # PXE hosts, one per Aztec version (pxe/, built into assets/pxe/), served to a hidden web view.
      - path: ../assets/pxe
        type: folder
        buildPhase: resources
      # The start page's dApp icons (icons/dapps/<host>.png), shipped so that showing them asks nothing of those sites.
      - path: ../icons/dapps
        type: folder
        buildPhase: resources
    dependencies:
      - package: AzwallKit
        product: AzwallKit
      - package: AzwallKit
        product: AzwallPlatform
      - package: AzwallRust
      # Barretenberg, one framework per release (scripts/build-bb-ios.sh). Embedded, not linked: the Rust prover
      # loads the one the network needs (rust/azwall-prover/src/library.rs).
      - framework: ../vendor/bb-ios/AzBB_6_0_0.xcframework
        embed: true
        link: false
    preBuildScripts:
      - name: Check the Rust core is built
        script: |
          # Xcode links build/ios/AzwallFFI.xcframework but cannot build it: an app with an older Rust core runs
          # without what changed since (a network's Ethereum side was silently lost that way). Fail instead.
          cd "$SRCROOT/.."
          lib=build/ios/AzwallFFI.xcframework/ios-arm64/libazwall_ffi.a
          newer=$(find rust -path rust/target -prune -o \( -name '*.rs' -o -name Cargo.toml \) -newer "$lib" -print 2>/dev/null | head -1)
          if [ ! -e "$lib" ] || [ -n "$newer" ]; then
            echo "error: the Rust core is older than ${newer:-its sources}: run scripts/build-ios.sh"
            exit 1
          fi
      - name: Resolve network config
        script: |
          # Xcode runs scripts without the login shell's PATH: add rustup's and Homebrew's.
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$SRCROOT/.." && cargo run --quiet -p azwall-core --bin azwall-config -- --out assets/azwall-config.json
          cd "$SRCROOT/../pxe" && pnpm install --frozen-lockfile --silent && pnpm build
        outputFiles:
          - $(SRCROOT)/../assets/azwall-config.json
          - $(SRCROOT)/../assets/pxe
    info:
      path: Azwall/Info.plist
      properties:
        CFBundleDisplayName: Azwall
        # The logo on the app's background colour (Palette.background) while the app starts.
        UILaunchScreen:
          UIImageName: Logo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        NSFaceIDUsageDescription: Azwall uses Face ID to unlock your wallet and confirm sensitive actions.
        NSCameraUsageDescription: Azwall uses the camera to scan the QR code of an address you send to.
        # The PXE host page is served from the app itself on 127.0.0.1 (a secure context for Web Crypto).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.azwall
        # ios/Azwall/Assets.xcassets, built from branding/azwall-icon.png by scripts/make-icons.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6"
