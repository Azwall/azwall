[package]
name = "azwall-ffi"
description = "Kotlin and Swift bindings (uniffi) over azwall-core and azwall-prover"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "azwall_ffi"
# cdylib for Android (JNA), staticlib for the iOS XCFramework, lib for Rust tests.
crate-type = ["cdylib", "staticlib", "lib"]

# The bindings generator is a tool of scripts/gen-bindings.sh, not part of the library the apps ship: behind a feature,
# the library depends on uniffi's runtime only (not its ~180 crates of generator, an unmaintained TOML parser among them).
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
azwall-core.workspace = true
azwall-prover.workspace = true
thiserror.workspace = true
uniffi = "0.32"

[dev-dependencies]
serde_json.workspace = true
