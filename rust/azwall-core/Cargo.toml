[package]
name = "azwall-core"
description = "Network registry, RPC configuration and node checks shared by the Azwall apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bip39 = { version = "3.0.0", default-features = false, features = ["std"] }
getrandom = "0.4.3"
num-bigint = "0.5.1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
thiserror.workspace = true
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[[bin]]
name = "azwall-config"
path = "src/bin/azwall-config.rs"
